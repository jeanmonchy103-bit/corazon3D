<DOCTYPE html>
  <html lang="es">
    <head>
      <meta charset="UTF-8">
      <title>mi corazon 3D</title>
      <style>
        body {
          background-color: black;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          margin: 0;
        }
        .herat {
          width: 100px;
          height: 100px;
          background-color: red;
          transform: rotate(-45deg);
          position: relative;
        }
        .heart: :before,
        .heart: :after{
        content: "";
          width: 100px;
          height: 100px;
          background-color: red;
          border-radius: 50%;
          position: absolute;
        }
        .heart: :before {
          top: -50px;
          left: 0;
        }
        .heart: :after {
          left: 50px;
          top: 0;
        }
        </style>
      </head>
    <body>
      <div class="heart"></div>
    </body>
  </html>
